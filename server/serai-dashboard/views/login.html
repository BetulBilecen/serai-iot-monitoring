<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş | Ortam Havası Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e1f3e5;--paper:#fbfcfb;--ink:#14332d;--muted:#5f7770;--line:#c9e4d0;--off:#d33c3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{width:min(500px,100%)}
.logo{width:80px;height:80px;border-radius:26px;background:var(--ink);color:#fff;display:grid;place-items:center;margin-bottom:22px}
.logo svg.i{width:42px;height:42px}
h1{margin:0;font-size:clamp(38px,9vw,56px);font-weight:700;letter-spacing:-.035em;line-height:1.02}
.sub{display:flex;gap:10px;align-items:flex-start;margin:12px 0 28px;color:var(--muted);font-size:18px}
.sub svg.i{margin-top:3px;color:#1d8f84}
form{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:30px;display:grid;gap:16px}
.f{position:relative}
.f>svg.i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
input{width:100%;font:inherit;font-size:18px;padding:17px 56px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:#1d8f84;box-shadow:0 0 0 4px #1d8f8426}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer;display:grid}
.eye:hover{color:var(--ink)}
.eye .off{display:none}
.eye.on .off{display:block}.eye.on .show{display:none}
button.go{font:inherit;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border-radius:16px;border:0;background:var(--ink);color:#fff;cursor:pointer;margin-top:4px}
button.go:hover{background:#1d4a41}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#h{display:none;align-items:center;gap:10px;color:var(--off);font-size:16px;background:#d33c3c14;border-radius:14px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:16px;color:var(--ink)}
.chips svg.i{width:20px;height:20px;color:var(--c)}
.note{display:flex;align-items:center;gap:10px;margin-top:20px;color:var(--muted);font-size:15px}
.note svg.i{color:#1f9d55}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="eyeoff" viewBox="0 0 24 24"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-2.2 3.2"/><path d="M6.6 6.6A16.6 16.6 0 0 0 2 12s3.5 8 10 8a9.7 9.7 0 0 0 4.4-1"/><path d="m2 2 20 20"/><path d="M10.7 10.7a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="temp" viewBox="0 0 24 24"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24"><path d="M12 2.7s7 7.3 7 12.3a7 7 0 0 1-14 0c0-5 7-12.3 7-12.3Z"/></symbol>
  <symbol id="fan" viewBox="0 0 24 24"><path d="M10.8 16.4a6.1 6.1 0 0 1-8.6-7l5.4 1.4a6.1 6.1 0 0 1 7-8.6l-1.4 5.4a6.1 6.1 0 0 1 8.6 7l-5.4-1.4a6.1 6.1 0 0 1-7 8.6l1.4-5.4Z"/><path d="M12 12v.01"/></symbol>
  <symbol id="pulse" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.500 20.500 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.500-1.200 6.200-2.700a1.200 1.200 0 0 1 1.500 0C14.500 3.800 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>
<main>
  <div class="logo" aria-hidden="true"><svg class="i"><use href="#wind"/></svg></div>
  <h1>Havanın nabzı</h1>
  <p class="sub"><svg class="i"><use href="#pulse"/></svg>Ortam havasının canlı ölçümlerini görmek için giriş yap.</p>

  <form method="post" action="/login">
    <div id="h" role="alert"><svg class="i"><use href="#alert"/></svg>Kullanıcı adı veya parola hatalı.</div>
    <div class="f">
      <svg class="i"><use href="#user"/></svg>
      <input name="username" placeholder="Kullanıcı adı" aria-label="Kullanıcı adı" autocomplete="username" required autofocus>
    </div>
    <div class="f">
      <svg class="i"><use href="#lock"/></svg>
      <input id="p" name="password" type="password" placeholder="Parola" aria-label="Parola" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Parolayı göster">
        <svg class="i show"><use href="#eye"/></svg><svg class="i off"><use href="#eyeoff"/></svg>
      </button>
    </div>
    <button class="go"><svg class="i"><use href="#login"/></svg>Giriş yap</button>
  </form>

  <div class="chips" aria-hidden="true">
    <span style="--c:#6b4fc4"><svg class="i"><use href="#wind"/></svg>Gaz</span>
    <span style="--c:#d9485f"><svg class="i"><use href="#temp"/></svg>Sıcaklık</span>
    <span style="--c:#2f7fd1"><svg class="i"><use href="#drop"/></svg>Nem</span>
    <span style="--c:#1d8f84"><svg class="i"><use href="#fan"/></svg>Fan</span>
    <span style="--c:#e08a1e"><svg class="i"><use href="#pulse"/></svg>Canlı akış</span>
    <span style="--c:#1d8f84"><svg class="i"><use href="#down"/></svg>CSV ve JSON</span>
  </div>
  <p class="note"><svg class="i"><use href="#shield"/></svg>Bu panele yalnızca parolası olanlar girebilir.</p>
</main>
<script>
if (location.search.includes('hata')) h.style.display = 'flex';
eye.onclick = () => {
  const gizli = p.type === 'password';
  p.type = gizli ? 'text' : 'password';
  eye.classList.toggle('on', gizli);
  eye.setAttribute('aria-label', gizli ? 'Parolayı gizle' : 'Parolayı göster');
};
</script>
</body>
</html>
